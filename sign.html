<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse - sign up page</title>


    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,-50..200" />

    <link
        href="https://fonts.googleapis.com/css2?family=Chelsea+Market&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Oldenburg&family=Outfit:wght@100..900&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto+Slab:wght@100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<style>
    * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
        font-family: "Noto Sans", sans-serif;
    }

    :root {
        --pcolor: #FFB334;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 100vh;
        background: #F7F5F3;
    }

    .signpage {
        display: grid;
        grid-template-columns: 1fr 1fr;
        width: 100%;
        max-width: 1000px;
        margin: 10px;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 1px 1px 20px var(--pcolor);
    }

    .left {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        position: relative;
        padding: 15px;
        background: linear-gradient(123deg, rgba(0, 0, 0, 0.829), rgba(0, 0, 0, 0.418)), url("./src/l1.webp");
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
    }

    .signlogo {
        position: absolute;
        left: 20px;
        top: 20px;
        width: 160px;
    }

    .left h1 {
        font-size: clamp(30px, 4vw, 45px);
        margin-bottom: 10px;
        color: var(--pcolor);
    }

    .left p {
        font-size: 15px;
        max-width: 400px;
        text-align: center;
        line-height: 1.5;
        color: white;
    }

    .right {
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: black;
        width: 100%;
        padding: 40px;
    }

    .right h1 {
        font-size: 30px;
        margin-bottom: 20px;
        text-align: center;
        color: var(--pcolor);
    }

    .inputbox {
        position: relative;
        margin-bottom: 15px;
    }

    .inputbox span {
        color: var(--pcolor);
    }

    .inputbox input,
    .inputbox select {
        width: 100%;
        padding: 12px 35px;
        border-radius: 5px;
        font-size: 13px;
        border: 1px solid var(--pcolor);
        background: transparent;
        color: white;
    }

    .inputbox input:focus {
        outline: none;
        box-shadow: 1px 1px 15px #ffb53496;
        background: transparent
    }

    .inputbox select:hover {
        outline: none;
        box-shadow: 1px 1px 15px #ffb53496;
    }

    .ic1 {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        font-size: 20px;
        left: 10px;
    }

    .ic2 {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        font-size: 20px;
        left: 10px;
    }

    .ic3 {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        font-size: 20px;
        right: 10px;
    }

    .submitbtn {
        width: 100%;
        padding: 12px 35px;
        border-radius: 5px;
        font-size: 16px;
        text-transform: capitalize;
        border: none;
        font-weight: bold;
        margin-bottom: 20px;
        background: var(--pcolor);
        transition: .6s ease;
    }

    .submitbtn:hover {
        transform: translateY(-4px);
        box-shadow: 1px 1px 20px var(--pcolor);
    }

    .signfooter {
        text-align: center;
    }

    .signfooter div {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 10px;
    }

    .signfooter div p,
    .signfooter div a,
    .signfooter a {
        text-decoration: none;
        font-size: 13px;
        color: white;
    }

    .signfooter div a:hover,
    .signfooter a:hover {
        color: var(--pcolor);
    }

    /**/

    .custom-select {
        position: relative;
        width: 100%;
    }

    .select-btn {
        width: 100%;
        height: 44px;
        border: 1px solid #ffb334;
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 0 5px;
        color: #fff;
        background: transparent;
        cursor: pointer;
    }

    .select-btn .arrow {
        margin-left: auto;
        transition: .3s;
    }

    .select-btn.active .arrow {
        transform: rotate(180deg);
    }

    .selected-text {
        color: #ffffff !important;
        font-size: 14px;
    }

    .select-options {
        position: absolute;
        width: 100%;
        top: 58px;
        left: 0px;
        background: #111;
        border: 1px solid #ffb334;
        border-radius: 8px;
        overflow: hidden;
        display: none;
        z-index: 100;
    }

    .select-options.show {
        display: block;
    }

    .option {
        padding: 14px 15px;
        display: flex;
        align-items: center;
        gap: 12px;
        color: white;
        cursor: pointer;
        transition: .3s;
    }

    .option:hover {
        background: #ffb334;
        color: black;
    }

    .option .material-symbols-outlined,
    .select-btn .material-symbols-outlined {
        color: #ffb334;
        font-size: 21px;
    }

    .option:hover .material-symbols-outlined {
        color: black;
    }


    @media (max-width:760px) {

        .left {
            min-height: 300px;
        }

        .right {
            padding: 15px;
        }

        .signpage {
            grid-template-columns: 1fr;
        }
    }
</style>

<body>
    <section class="signpage">

        <div class="left">
            <a href="sign.html"><img src="./src/logo.webp" alt="company logo" class="signlogo"></a>
            <h1>Get Started Today</h1>
            <p>Create your account to manage inventory, shipments, and warehouse operations efficiently.</p>
        </div>

        <div class="right">
            <h1>Create Your Accout</h1>

            <form class="formbox">

                <div class="inputbox">
                    
                    <div class="custom-select">
                        <div class="select-btn">
                            <span class="material-symbols-outlined">person</span>
                            <span class="selected-text">Select Role</span>
                            <span class="material-symbols-outlined arrow">keyboard_arrow_down</span>
                        </div>

                        <div class="select-options">
                            <div class="option" data-value="Admin">

                                Admin
                            </div>

                            <div class="option" data-value="Client">

                                Client
                            </div>
                        </div>

                        <input type="hidden" id="role" name="role">
                    </div>
                </div>

                <div class="inputbox">
                    <span class="material-symbols-outlined ic1">package_2</span>
                    <input type="text" placeholder="Enter Your Name" id="name">
                </div>

                <div class="inputbox">
                    <span class="material-symbols-outlined ic1">call</span>
                    <input type="tel" placeholder="Enter Your Number" id="number">
                </div>

                <div class="inputbox">
                    <span class="material-symbols-outlined ic1">mail</span>
                    <input type="email" placeholder="Enter Your Email" id="email">
                </div>

                <div class="inputbox">
                    <span class="material-symbols-outlined ic2">lock</span>
                    <input type="password" placeholder="Enter Your Password" id="password">
                    <span class="material-symbols-outlined ic3">visibility</span>
                </div>

                <div class="inputbox">
                    <span class="material-symbols-outlined ic2">lock</span>
                    <input type="password" placeholder="Enter Your Confirm Password" id="password1">
                    <span class="material-symbols-outlined ic3">visibility</span>
                </div>

                <div class="sbtn">
                    <button class="submitbtn">submit</button>
                </div>

            </form>

            <div class="signfooter">
                <div>
                    <p>Already have an Account?</p>
                    <a href="login.html">Login Now</a>
                </div>
                <a href="index.html">Back to Home</a>
            </div>

        </div>

    </section>

    <script>

        const selectBtn = document.querySelector(".select-btn");
        const options = document.querySelector(".select-options");
        const selectedText = document.querySelector(".selected-text");
        const roleInput = document.querySelector("#role");

        selectBtn.addEventListener("click", () => {
            options.classList.toggle("show");
            selectBtn.classList.toggle("active");
        });

        document.querySelectorAll(".option").forEach(option => {
            option.addEventListener("click", () => {
                selectedText.textContent = option.textContent.trim();
                selectedText.style.color = "white";

                roleInput.value = option.dataset.value;

                options.classList.remove("show");
                selectBtn.classList.remove("active");
            });
        });

        document.addEventListener("click", (e) => {
            if (!e.target.closest(".custom-select")) {
                options.classList.remove("show");
                selectBtn.classList.remove("active");
            }
        }); 
    </script>
</body>

</html>
