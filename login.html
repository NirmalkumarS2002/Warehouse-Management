<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse Login Page</title>

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,-50..200" />

    <link
        href="https://fonts.googleapis.com/css2?family=Chelsea+Market&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Oldenburg&family=Outfit:wght@100..900&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto+Slab:wght@100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        html,
        body {
            overflow-x: hidden;
        }

        :root {
            --pcolor: #FFB334;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: white;
        }

        .loginpage {
            width: 100%;
            min-height: 500px;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            font-family: "Noto Sans", sans-serif;
            margin: 10px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 1px 1px 20px var(--pcolor);
        }

        .right {
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
            background: linear-gradient(123deg, rgba(0, 0, 0, 0.829), rgba(0, 0, 0, 0.418)), url("./src/l1.webp");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

        }

        .orbody {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0px;
        }

        .or {
            color: white;
            font-size: 12px;
            position: relative;
        }

        .or::before,
        .or::after {
            content: "";
            width: 100px;
            height: 1px;
            top: 50%;
            background: white;
            position: absolute;
        }

        .or::before {
            left: 34px;
        }

        .or::after {
            right: 34px;
        }


        .googleicons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 15px 0px;
        }

        .googleicons a {
            font-size: 25px;
            color: var(--pcolor);
            transition: .6s ease;
        }

        .googleicons a:hover {
            transform: scale(1.3);
        }

        .right h1 {
            font-size: clamp(35px, 4vw, 50px);
            margin-bottom: 10px;
            color: var(--pcolor);
        }

        .right p {
            font-size: 16px;
            text-align: center;
            color: white;
        }

        .logoimage img {
            position: absolute;
            left: 20px;
            top: 20px;
            width: 160px;
        }

        .left {
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: black;
            padding: 40px;
            width: 100%;
        }

        .left h1 {
            font-size: 35px;
            text-align: center;
            margin-bottom: 25px;
            color: var(--pcolor);

        }

        .inputbox {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
        }

        .inputbox input,
        .inputbox select {
            width: 100%;
            padding: 12px 30px;
            border-radius: 5px;
            font-size: 13px;
            border: 1px solid var(--pcolor);
            background: transparent;
            color: white;
        }

        .inputbox input:focus {
            outline: none;
            box-shadow: 1px 1px 15px #ffb53496;
            background: transparent
        }

        .inputbox select:hover {
            outline: none;
            box-shadow: 1px 1px 15px #ffb53496;
        }

        .mail {
            position: absolute;
            top: 50%;
            left: 5px;
            font-size: 20px;
            transform: translateY(-50%);
            color: var(--pcolor);
        }

        .pass1 {
            position: absolute;
            top: 50%;
            left: 5px;
            font-size: 20px;
            transform: translateY(-50%);
            color: var(--pcolor);
        }

        .pass2 {
            position: absolute;
            top: 50%;
            right: 10px;
            font-size: 20px;
            transform: translateY(-50%);
            color: var(--pcolor);
        }

        .forget {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            font-weight: bold;
        }

        .forget a {
            text-decoration: none;
            font-size: 12px;
            color: var(--pcolor);
            text-align: center;
            margin-bottom: 15px;
        }

        .loginbtn {
            width: 100%;
            padding: 12px 30px;
            border-radius: 5px;
            border: none;
            margin-bottom: 15px;
            font-size: 13px;
            font-weight: bold;
            background: var(--pcolor);
            transition: .6s ease;
        }

        .loginbtn:hover {
            transform: translateY(-4px);
            box-shadow: 1px 1px 20px var(--pcolor);
        }

        .loginfooter div {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-bottom: 10px;
        }

        .loginfooter>a {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            gap: 5px;
            font-size: 12px;
        }

        .loginfooter>a:hover,
        .loginfooter div a:hover {
            color: var(--pcolor);
        }

        .loginfooter>a span {
            font-size: 20px;
        }

        .loginfooter div p,
        .loginfooter div a {
            color: white;
            font-size: 12px;
            text-decoration: none;
        }


        /**/

        .custom-select {
            position: relative;
            width: 100%;
        }

        .select-btn {
            width: 100%;
            height: 44px;
            border: 1px solid #ffb334;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 0 5px;
            color: #fff;
            background: transparent;
            cursor: pointer;
        }

        .select-btn .arrow {
            margin-left: auto;
            transition: .3s;
        }

        .select-btn.active .arrow {
            transform: rotate(180deg);
        }

        .selected-text {
            color: #bcbcbc;
            font-size: 13px;
        }

        .select-options {
            position: absolute;
            width: 100%;
            top: 58px;
            left: 0px;
            background: #111;
            border: 1px solid #ffb334;
            border-radius: 8px;
            overflow: hidden;
            display: none;
            z-index: 100;
        }

        .select-options.show {
            display: block;
        }

        .option {
            padding: 14px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            cursor: pointer;
            transition: .3s;
        }

        .option:hover {
            background: #ffb334;
            color: black;
        }

        .option .material-symbols-outlined,
        .select-btn .material-symbols-outlined {
            color: #ffb334;
            font-size: 21px;
        }

        .option:hover .material-symbols-outlined {
            color: black;
        }

        @media (max-width:720px) {
            .loginpage {
                grid-template-columns: 1fr;
                grid-template-rows: 300px 1fr;
                margin: 10px;
            }

            .left {
                padding: 20px;
            }

        }
    </style>

</head>


<body>
    <section class="loginpage">
        <div class="right">
            <a href="login.html" class="logoimage"><img src="./src/logo.webp" alt="company logo"></a>
            <h1>Welcome Back</h1>
            <p>Access your warehouse dashboard and keep operations moving smoothly.</p>
        </div>

        <div class="left">
            <h1>Login Here</h1>

            <form class="login-form">

                <div class="inputbox">

               

                    <div class="custom-select">
                        <div class="select-btn">
                            <span class="material-symbols-outlined">person</span>
                            <span class="selected-text">Select Role</span>
                            <span class="material-symbols-outlined arrow">keyboard_arrow_down</span>
                        </div>

                        <div class="select-options">
                            <div class="option" data-value="Admin">
                               
                                Admin
                            </div>

                            <div class="option" data-value="Client">
                                
                                Client
                            </div>
                        </div>

                        <input type="hidden" id="role" name="role">
                    </div>
                </div>

                <div class="inputbox">
                    <span class="material-symbols-outlined mail">mail</span>
                    <input type="email" placeholder="Enter Your Email" id="email">
                </div>

                <div class="inputbox">
                    <span class="material-symbols-outlined pass1">lock</span>
                    <input type="password" placeholder="Enter Your Password" id="password">
                    <span class="material-symbols-outlined pass2">visibility_off</span>
                </div>

                <div class="forget">
                    <a href="404.html">Forget Password?</a>
                </div>

                <div class="sbtn">
                    <button type="submit" class="loginbtn">Login</button>
                </div>
            </form>

            <div class="loginbody">

                <div class="orbody">
                    <p class="or">or</p>
                </div>

                <div class="googleicons">
                    <a href="404.html"><i class="fa-brands fa-google"></i></a>
                    <a href="404.html"><i class="fa-brands fa-edge-legacy"></i></a>
                    <a href="404.html"><i class="fa-brands fa-edge"></i></a>
                </div>
            </div>

            <div class="loginfooter">
                <div>
                    <p>Don't Have an Accout?</p><a href="sign.html">Create Account</a>
                </div>
                <a href="index.html"><span class="material-symbols-outlined">arrow_left_alt</span>Back to Home</a>
            </div>
        </div>
    </section>

    <script>
        const loginform = document.querySelector(".login-form")
        const role = document.querySelector("#role")
        const email = document.querySelector("#email")
        const password = document.querySelector("#password")

        loginform.addEventListener("submit", (e) => {

            e.preventDefault()

            const emailregex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/

            if (role.value.trim() == "") {
                alert("Select Your Role")
                role.focus();
                return;
            }

            if (email.value.trim() == "") {
                alert("Please Enter Your Email")
                email.focus();
                return;
            }

            if (!emailregex.test(email.value.trim())) {
                alert("Please Enter Valid Email")
                email.focus();
                return;
            }

            if (password.value.trim() == "") {
                alert("Please Enter Your Password")
                password.focus();
                return;
            }

            if (password.value.trim().length < 6) {
                alert("password Must be in 6 Chars")
                password.focus();
                return;
            }

            localStorage.setItem("useremail", email.value)

            if (role.value.trim() == "Admin") {
                window.location.href = "admin.html"
            }
            if (role.value.trim() == "Client") {
                window.location.href = "client.html"
            }

            alert("login Successfully!")
        })


        //pass eye

        const passeye = document.querySelector(".pass2")

        passeye.addEventListener("click", () => {
            if (passeye.textContent == "visibility_off") {

            }

        })

        //

        const selectBtn = document.querySelector(".select-btn");
        const options = document.querySelector(".select-options");
        const selectedText = document.querySelector(".selected-text");
        const roleInput = document.querySelector("#role");

        selectBtn.addEventListener("click", () => {
            options.classList.toggle("show");
            selectBtn.classList.toggle("active");
        });

        document.querySelectorAll(".option").forEach(option => {
            option.addEventListener("click", () => {
                selectedText.textContent = option.textContent.trim();
                selectedText.style.color = "white";

                roleInput.value = option.dataset.value;

                options.classList.remove("show");
                selectBtn.classList.remove("active");
            });
        });

        document.addEventListener("click", (e) => {
            if (!e.target.closest(".custom-select")) {
                options.classList.remove("show");
                selectBtn.classList.remove("active");
            }
        });
    </script>
</body>

</html>
